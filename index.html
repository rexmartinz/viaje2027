<style>
:root {
  /* Dimension Light Palette */
  --bg-app: #f7fbf8;
  --bg-sidebar: #f5f4fa;
  --bg-surface: #ffffff;
  --bg-subtle: #f0eff8;
  --bg-pill: #f1f3f5;
  
  --ink-primary: #18181b;
  --ink-secondary: #52525b;
  --ink-muted: #71717a;
  --ink-tertiary: #a1a1aa;

  --accent-green: #15803d;
  --accent-green-soft: #dcfce7;
  --accent-blue: #15803d;

  --border-hairline: #e4e4e7;
  --border-subtle: #eeedf2;
  --border-focus: #15803d;

  /* Status Colors */
  --status-ok-bg: #ecfdf5;
  --status-ok-text: #047857;
  --status-ok-border: #a7f3d0;

  --status-warn-bg: #fffbeb;
  --status-warn-text: #b45309;
  --status-warn-border: #fde68a;

  --status-danger-bg: #fef2f2;
  --status-danger-text: #b91c1c;
  --status-danger-border: #fecaca;

  --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-heading: 'Geist', 'DM Sans', sans-serif;
  --font-cursive: 'Caveat', cursive, sans-serif;

  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 9999px;

  --shadow-subtle: 0 1px 3px rgba(24, 24, 27, 0.04), 0 1px 2px rgba(24, 24, 27, 0.02);
  --shadow-card: 0 4px 16px -2px rgba(24, 24, 27, 0.04), 0 2px 6px -1px rgba(24, 24, 27, 0.02);
  --shadow-card-hover: 0 10px 25px -4px rgba(24, 24, 27, 0.08), 0 4px 10px -2px rgba(24, 24, 27, 0.03);
  --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-app);
  color: var(--ink-primary);
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  overflow: hidden;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; }

/* Ambient background warm glow */
.bg-ambience {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: 
    radial-gradient(ellipse 60% 45% at 85% 10%, rgba(21, 128, 61, 0.05) 0%, transparent 65%),
    radial-gradient(ellipse 50% 50% at 10% 85%, rgba(245, 158, 11, 0.03) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(240, 253, 244, 0.4) 0%, transparent 70%);
  z-index: 0;
}

/* Sidebar */
.side {
  width: 290px;
  flex: none;
  background: var(--bg-sidebar);
  color: var(--ink-primary);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  border-right: 1px solid var(--border-hairline);
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  position: relative;
  z-index: 10;
}

.brand {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border-hairline);
}
.brand-tagline {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent-green);
  font-weight: 700;
  margin-bottom: 4px;
}
.brand h1 {
  margin: 0;
  font-family: var(--font-heading);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.03em;
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: var(--ink-primary);
}
.brand h1 .ai-tag {
  font-family: var(--font-cursive);
  font-weight: 600;
  font-size: 24px;
  color: var(--accent-green);
  transform: rotate(-4deg);
  display: inline-block;
}
.brand p {
  margin: 6px 0 0;
  color: var(--ink-muted);
  font-size: 13px;
  line-height: 1.4;
}

.side h2 {
  margin: 26px 24px 10px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.nav { list-style: none; margin: 0; padding: 0 12px; }
.nav button {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  padding: 10px 14px;
  color: var(--ink-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all .15s cubic-bezier(0.16, 1, 0.3, 1);
  margin-bottom: 4px;
}
.nav button:hover {
  background: rgba(255, 255, 255, 0.85);
  color: var(--ink-primary);
  border-color: var(--border-hairline);
}
.nav button.on {
  background: var(--bg-surface);
  color: var(--ink-primary);
  border-color: var(--border-hairline);
  box-shadow: var(--shadow-subtle);
  font-weight: 600;
}
.nav button.on .ico {
  transform: scale(1.08);
}
.nav .ico {
  font-size: 19px;
  width: 26px;
  text-align: center;
  transition: transform .15s ease;
}
.nav .lbl { flex: 1; min-width: 0; }
.nav .lbl b { display: block; font-weight: 600; font-size: 14px; color: var(--ink-primary); }
.nav .lbl small { display: block; color: var(--ink-muted); font-size: 12px; margin-top: 2px; }

.badge {
  background: var(--status-warn-bg);
  color: var(--status-warn-text);
  border: 1px solid var(--status-warn-border);
  border-radius: var(--radius-pill);
  font-size: 11px;
  padding: 2px 8px;
  font-weight: 700;
}

/* Main Area */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
  position: relative;
  z-index: 2;
  background: transparent;
}
.topbar {
  display: none;
  align-items: center;
  gap: 12px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-hairline);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
}
.topbar button {
  background: var(--bg-app);
  border: 1px solid var(--border-hairline);
  color: var(--ink-primary);
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
}
.topbar span { font-weight: 700; font-size: 17px; font-family: var(--font-heading); }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 38px 44px calc(52px + env(safe-area-inset-bottom, 0px));
  max-width: 1020px;
  width: 100%;
  margin: 0 auto;
}
.scrim { display: none; }

/* Titles */
h2.title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.035em;
  color: var(--ink-primary);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sub {
  color: var(--ink-secondary);
  margin: 6px 0 28px;
  font-size: 14.5px;
}
.sub .italic-accent {
  font-family: var(--font-cursive);
  font-size: 20px;
  color: var(--accent-green);
  margin-left: 8px;
  font-weight: 600;
}
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* KPI Chips */
.chips {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin: 0 0 32px;
}
.chip {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-subtle);
  transition: transform .15s ease, box-shadow .15s ease;
}
.chip:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card);
}
.chip::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--border-hairline);
}
.chip.ok::before { background: #10b981; }
.chip.warn::before { background: #f59e0b; }
.chip.tot::before { background: var(--accent-green); }

.chip small {
  display: block;
  color: var(--ink-muted);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.chip b {
  font-family: var(--font-heading);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--ink-primary);
}
.chip.ok b { color: #047857; }
.chip.warn b { color: #b45309; }
.chip.tot b { color: var(--ink-primary); }

/* Buttons & Dimension Pill System */
.btn {
  background: var(--ink-primary);
  color: #ffffff;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  padding: 10px 22px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all .15s ease;
  box-shadow: 0 2px 5px rgba(24, 24, 27, 0.12);
}
.btn:hover {
  background: #27272a;
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(24, 24, 27, 0.16);
}
.btn.ghost {
  background: var(--bg-surface);
  color: var(--ink-primary);
  border: 1px solid var(--border-hairline);
  box-shadow: var(--shadow-subtle);
}
.btn.ghost:hover {
  background: #fdfdfd;
  border-color: #d4d4d8;
  color: var(--ink-primary);
}
.btn.danger {
  background: #fff;
  color: var(--status-danger-text);
  border: 1px solid var(--status-danger-border);
  box-shadow: none;
}
.btn.danger:hover {
  background: var(--status-danger-bg);
  border-color: #f87171;
}
.btn.sm {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: var(--radius-pill);
  font-weight: 500;
}

/* Section Header */
.group {
  margin: 32px 0 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.group::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-subtle);
}

/* Entry Card (Clean White Floating Surface) */
.card {
  background: var(--bg-surface);
  color: var(--ink-primary);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-lg);
  padding: 18px 22px;
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 4px 18px;
  align-items: center;
  box-shadow: var(--shadow-subtle);
  transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
}
.card:hover {
  border-color: #d4d4d8;
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}
.card .ico {
  font-size: 24px;
  grid-row: span 2;
  align-self: center;
  background: var(--bg-app);
  border: 1px solid var(--border-subtle);
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
}
.card .t {
  font-weight: 600;
  font-size: 15.5px;
  color: var(--ink-primary);
  letter-spacing: -0.015em;
}
.card .m {
  color: var(--ink-secondary);
  font-size: 13px;
  margin-top: 3px;
  overflow-wrap: anywhere;
}
.card .p {
  text-align: right;
  font-weight: 700;
  font-size: 17px;
  font-family: var(--font-heading);
  color: var(--ink-primary);
  white-space: nowrap;
}
.card .p small {
  display: block;
  color: var(--ink-muted);
  font-weight: 400;
  font-size: 12.5px;
  font-family: var(--font-sans);
  margin-top: 2px;
}
.card .acts {
  grid-column: 2 / 4;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}

/* Status Tags (Dimension Pill) */
.tag {
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all .15s ease;
}
.tag:hover {
  filter: brightness(0.96);
  transform: translateY(-1px);
}
.tag.ok {
  background: var(--status-ok-bg);
  color: var(--status-ok-text);
  border-color: var(--status-ok-border);
}
.tag.warn {
  background: var(--status-warn-bg);
  color: var(--status-warn-text);
  border-color: var(--status-warn-border);
}

.empty {
  color: var(--ink-muted);
  background: #ffffff;
  border: 1.5px dashed var(--border-hairline);
  border-radius: var(--radius-lg);
  padding: 40px 24px;
  text-align: center;
  font-size: 14.5px;
}

/* Light Panels */
.panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-lg);
  padding: 26px 28px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-subtle);
}
.panel h3 {
  margin: 0 0 16px;
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink-primary);
  letter-spacing: -0.02em;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

label {
  display: block;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-secondary);
  margin-bottom: 14px;
  font-weight: 600;
}
input, select, textarea {
  width: 100%;
  margin-top: 6px;
  background: #ffffff;
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  color: var(--ink-primary);
  font-size: 14.5px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent-green);
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.12);
  outline: none;
}
textarea { min-height: 85px; resize: vertical; }

.rate { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.rate span { white-space: nowrap; font-weight: 600; color: var(--ink-secondary); font-size: 14px; }
.rate input { margin: 0; max-width: 150px; font-weight: 500; }

.result {
  font-family: var(--font-heading);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 16px 0 0;
  color: var(--ink-primary);
}
.note { color: var(--ink-muted); font-size: 13px; line-height: 1.5; margin-top: 10px; }

table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { padding: 14px 12px; border-bottom: 1px solid var(--border-subtle); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
tr:hover td { background: var(--bg-app); }
tr.tot td {
  font-weight: 700;
  border-bottom: 0;
  color: var(--ink-primary);
  font-size: 16px;
  padding-top: 18px;
  font-family: var(--font-heading);
}

/* Modal Bottom-sheet / Dialog (Light Warm) */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(24, 24, 27, 0.45);
  backdrop-filter: blur(8px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 40;
  padding: 16px;
}
.modal.show { display: flex; animation: fadeIn .2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: var(--radius-lg);
  padding: 28px 30px calc(28px + env(safe-area-inset-bottom, 0px));
  box-shadow: var(--shadow-modal);
}
.sheet h3 {
  margin: 0 0 18px;
  font-family: var(--font-heading);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink-primary);
}
.check {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-primary);
  font-size: 14.5px;
  text-transform: none;
  margin-top: 14px;
  cursor: pointer;
}
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink-primary); cursor: pointer; }

/* Currency dropdown pill */
.select-pill {
  margin: 0;
  width: auto;
  padding: 7px 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-pill);
  font-weight: 600;
  color: var(--ink-primary);
  box-shadow: var(--shadow-subtle);
  cursor: pointer;
}

@media (max-width: 780px) {
  .side {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 30;
    transform: translateX(-100%);
    transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
  }
  body.menu .side { transform: none; }

function doExport(){
  var json = JSON.stringify(S, null, 2);
  function legacy(){
    var blob = new Blob([json], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'viaje-2027-respaldo.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(!dl){ legacy(); return; }
      dl.save({filename:'viaje-2027-respaldo.json', data:json})
        .then(function(){ toast('Respaldo guardado.'); })
        .catch(function(e){ if(!e || e.code !== 'declined') toast('No se pudo guardar el respaldo.'); });
    }).catch(legacy);
  } else legacy();
}
function doImport(file){
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      d = migrate(d);
      if(!d) throw new Error('formato');
      S = d; save(); V = {k:'backup'}; render();
      toast('Copia de seguridad restaurada.');
    }catch(e){ toast('No se pudo leer el archivo. Elige un JSON válido.'); }
  };
  r.readAsText(file);
}

      (navigator.onLine === false ? '<div style="padding:30px 16px; text-align:center; font-size:13px; color:#52525b; line-height:1.5;">📡 Sin conexión: el mapa necesita internet.<br>Usa el botón de abajo para abrir la app de Google Maps con tus mapas sin conexión.</div>' : '<iframe title="Google Maps" src="https://maps.google.com/maps?q=' + q + '&hl=es&z=14&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen style="display:block; width:100%; height:52vh; min-height:280px; border:0;"></iframe>') +
    '</div>' +
    '<p style="font-size:12px; color:#71717a; margin:10px 0 12px;">Si el mapa no carga, necesitas conexión a internet; también puedes abrirlo directamente en Google Maps.</p>' +
    '<a href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" rel="noopener" style="display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; background:#15803d; color:#ffffff; padding:12px; border-radius:9999px; font-weight:600; font-size:14px;">Abrir en la app de Google Maps</a>';
  $('modal').style.display = 'flex';
}

function saveForm(did, eid){
  var title = $('fTitle').value.trim();
  if(!title){ $('fTitle').focus(); return; }
  var p = $('fPrice').value;
  var obj = {
    id: eid || uid(), type: $('fType').value, title: title, date: $('fDate').value,
    time: $('fTime').value.trim(), price: p === '' ? null : parseFloat(p), cur: $('fCur').value,
    paid: $('fPaid').checked, notes: $('fNotes').value.trim()
  };
  var d = dest(did);
  if(eid){
    d.entries = d.entries.map(function(x){ return x.id === eid ? obj : x; });
  } else {
    d.entries.push(obj);
  }
  save(); closeForm(); render();
}

var IN = 'width:100%; border:1px solid #e4e4e7; border-radius:10px; padding:8px 10px; margin-top:4px;';
var LB = 'font-size:12px; font-weight:600; color:#52525b; display:block; margin-top:12px; margin-bottom:0;';

function findStop(d, sid){
  for(var i = 0; i < d.itin.length; i++){
    for(var j = 0; j < d.itin[i].stops.length; j++){
      if(d.itin[i].stops[j].id === sid) return {day:d.itin[i], stop:d.itin[i].stops[j]};
    }
  }
  return null;
}

function openStopForm(did, sid){
  var d = dest(did || V.id);
  var f = sid ? findStop(d, sid) : null;
  var st = f ? f.stop : {time:'', place:'', desc:''};
  var date = f ? f.day.date : (d.from || '');
  var title = f ? (f.day.title || '') : '';
  $('sheet').innerHTML =
    '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">' +
      '<h3 style="margin:0; font-size:18px; font-weight:700;">' + (sid ? 'Editar parada' : 'Nueva parada') + ' · ' + esc(d.name) + '</h3>' +
      '<button data-a="closeForm" aria-label="Cerrar" style="background:none; border:none; font-size:22px; cursor:pointer; color:#71717a;">✕</button>' +
    '</div>' +
    '<label style="' + LB + '">Lugar o actividad<input id="sPlace" value="' + esc(st.place) + '" placeholder="Ej: Puente de Carlos" style="' + IN + '"></label>' +
    '<div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;">' +
      '<label style="' + LB + '">Fecha<input id="sDate" type="date" value="' + esc(date) + '" style="' + IN + '"></label>' +
      '<label style="' + LB + '">Hora<input id="sTime" type="time" value="' + esc(st.time) + '" style="' + IN + '"></label>' +
    '</div>' +
    '<label style="' + LB + '">Título del día (opcional)<input id="sDayTitle" value="' + esc(title) + '" placeholder="Ej: Castillo y Malá Strana" style="' + IN + '"></label>' +
    '<label style="' + LB + '">Descripción<textarea id="sDesc" placeholder="Notas, cómo llegar, reserva..." style="' + IN + ' min-height:70px;">' + esc(st.desc) + '</textarea></label>' +
    '<div style="display:flex; gap:10px; margin-top:20px;">' +
      (sid ? '<button data-a="delStop" data-d="' + d.id + '" data-id="' + sid + '" style="flex:1; padding:11px; border:1px solid #fecaca; background:#ffffff; color:#b91c1c; border-radius:9999px; font-weight:600;">Eliminar</button>' : '<button data-a="closeForm" style="flex:1; padding:11px; border:1px solid #e4e4e7; background:#ffffff; border-radius:9999px; font-weight:600;">Cancelar</button>') +
      '<button data-a="saveStop" data-d="' + d.id + '" data-id="' + (sid || '') + '" style="flex:1.5; padding:11px; border:none; background:#15803d; color:#ffffff; border-radius:9999px; font-weight:600;">Guardar</button>' +
    '</div>';
  $('modal').style.display = 'flex';
  if(!sid) setTimeout(function(){ if($('sPlace')) $('sPlace').focus(); }, 40);
}

function saveStop(did, sid){
  var place = $('sPlace').value.trim();
  if(!place){ $('sPlace').focus(); return; }
  var date = $('sDate').value;
  if(!date){ $('sDate').focus(); return; }
  var d = dest(did), title = $('sDayTitle').value.trim();
  var obj = {id:sid || uid(), time:$('sTime').value, place:place, desc:$('sDesc').value.trim(), type:'visita'};
  if(sid){
    var f = findStop(d, sid);
    if(f){ obj.type = f.stop.type || 'visita'; f.day.stops = f.day.stops.filter(function(x){ return x.id !== sid; }); }
  }
  var day = d.itin.filter(function(x){ return x.date === date; })[0];
  if(!day){ day = {id:uid(), date:date, title:title, stops:[]}; d.itin.push(day); }
  else if(title){ day.title = title; }
  day.stops.push(obj);
  d.itin = d.itin.filter(function(x){ return x.stops.length > 0; });
  save(); closeForm(); render();
}

function delStop(did, sid){
  askConfirm('¿Eliminar esta parada del itinerario?', 'Eliminar', function(){
    var d = dest(did), f = findStop(d, sid);
    if(f) f.day.stops = f.day.stops.filter(function(x){ return x.id !== sid; });
    d.itin = d.itin.filter(function(x){ return x.stops.length > 0; });
    save(); closeForm(); render();
  });
}

function syncCityRate(){
  var c = $('cCur').value, w = $('cRateWrap');
  if(!w) return;
  w.style.display = c === 'EUR' ? 'none' : 'block';
  $('cRateCur').textContent = c;
  var r = S.rates[c];
  $('cRate').value = (r == null ? '' : r);
}

function openCityForm(did){
  var d = did ? dest(did) : null;
  var cur = d ? d.cur : 'EUR';
  var all = curList().concat(EXTRA_CURS.filter(function(x){ return curList().indexOf(x) < 0; }));
  var opts = all.map(function(c){ return '<option value="' + c + '"' + (c === cur ? ' selected' : '') + '>' + c + ' ' + (SYM[c] || '') + '</option>'; }).join('');
  $('sheet').innerHTML =
    '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">' +
      '<h3 style="margin:0; font-size:18px; font-weight:700;">' + (d ? 'Editar lugar' : 'Nuevo país o ciudad') + '</h3>' +
      '<button data-a="closeForm" aria-label="Cerrar" style="background:none; border:none; font-size:22px; cursor:pointer; color:#71717a;">✕</button>' +
    '</div>' +
    '<div style="display:grid; grid-template-columns:76px minmax(0,1fr); gap:10px;">' +
      '<label style="' + LB + '">Icono<input id="cIcon" value="' + esc(d ? d.icon : '📍') + '" style="' + IN + ' text-align:center;"></label>' +
      '<label style="' + LB + '">Nombre<input id="cName" value="' + esc(d ? d.name : '') + '" placeholder="Ej: Roma, Italia" style="' + IN + '"></label>' +
    '</div>' +
    '<div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;">' +
      '<label style="' + LB + '">Llegada<input id="cFrom" type="date" value="' + esc(d ? d.from : '') + '" style="' + IN + '"></label>' +
      '<label style="' + LB + '">Salida<input id="cTo" type="date" value="' + esc(d ? d.to : '') + '" style="' + IN + '"></label>' +
    '</div>' +
    '<label style="' + LB + '">Moneda local<select id="cCur" data-a="cityCur" style="' + IN + '">' + opts + '</select></label>' +
    '<div id="cRateWrap" style="display:none;"><label style="' + LB + '">Tipo de cambio: 1 EUR = <span id="cRateCur"></span><input id="cRate" type="number" step="0.0001" inputmode="decimal" placeholder="Ej: 4.30" style="' + IN + '"></label></div>' +
    '<div style="display:flex; gap:10px; margin-top:20px;">' +
      (d && S.dests.length > 1 ? '<button data-a="delCity" data-id="' + d.id + '" style="flex:1; padding:11px; border:1px solid #fecaca; background:#ffffff; color:#b91c1c; border-radius:9999px; font-weight:600;">Eliminar</button>' : '<button data-a="closeForm" style="flex:1; padding:11px; border:1px solid #e4e4e7; background:#ffffff; border-radius:9999px; font-weight:600;">Cancelar</button>') +
      '<button data-a="saveCity" data-id="' + (d ? d.id : '') + '" style="flex:1.5; padding:11px; border:none; background:#15803d; color:#ffffff; border-radius:9999px; font-weight:600;">Guardar</button>' +
    '</div>';
  syncCityRate();
  $('modal').style.display = 'flex';
  if(!d) setTimeout(function(){ if($('cName')) $('cName').focus(); }, 40);
}

function saveCity(did){
  var name = $('cName').value.trim();
  if(!name){ $('cName').focus(); return; }
  var from = $('cFrom').value, to = $('cTo').value, cur = $('cCur').value;
  if(from && to && to < from){ toast('La fecha de salida es anterior a la de llegada.'); return; }
  if(cur !== 'EUR'){
    var rv = parseFloat($('cRate').value);
    if(rv > 0) S.rates[cur] = rv;
    else if(!(rate(cur) > 0)){ $('cRate').focus(); return; }
  }
  var icon = $('cIcon').value.trim() || '📍';
  var d = did ? dest(did) : null, id;
  if(d){
    d.name = name; d.icon = icon; d.from = from; d.to = to; d.cur = cur; id = d.id;
  } else {
    var slug = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    id = (slug || 'lugar') + '-' + uid().slice(0, 4);
    S.dests.push({id:id, name:name, icon:icon, from:from, to:to, cur:cur, entries:[], itin:[]});
  }
  S.dests.sort(function(a, b){ return (a.from || '9999').localeCompare(b.from || '9999'); });
  V = {k:'dest', id:id};
  save(); closeForm(); render();
  $('content').scrollTop = 0;
}

function delCity(did){
  if(S.dests.length <= 1) return;
  var d = dest(did);
  askConfirm('¿Eliminar ' + d.name + ' con todos sus gastos e itinerario?', 'Eliminar', function(){
    S.dests = S.dests.filter(function(x){ return x.id !== did; });
    V = {k:'dest', id:S.dests[0].id};
    save(); closeForm(); render();
  });
}

function renderBar(){
  var inDest = V.k === 'dest';
  $('btnQuickGastos').className = 'bar-btn' + (inDest && TAB === 'gastos' ? ' on' : '');
  $('btnQuickItin').className = 'bar-btn' + (inDest && TAB === 'itinerario' ? ' on' : '');
  $('appBar').style.display = inDest ? '' : 'none';
  $('btnQuickGastos').closest('.phone-frame').classList.toggle('nobar', !inDest);
  var add = $('btnQuickAdd'), t = TAB === 'gastos' ? 'Nuevo gasto' : 'Nueva parada';
  add.setAttribute('aria-label', t); add.title = t;
}

function render(){
  var sel = document.querySelector('[data-a="setDisp"]');
  if(sel){
    var cl = curList();
    if(cl.indexOf(S.disp) < 0) S.disp = 'EUR';
    sel.innerHTML = cl.map(function(c){ return '<option value="' + c + '">' + c + ' ' + (SYM[c] || '') + '</option>'; }).join('');
    sel.value = S.disp;
  }
  if(V.k === 'dest'){
    if(!dest(V.id)) V = {k:'dest', id:S.dests[0].id};
    lastDest = V.id;
  }
  renderCarousel();
  if(V.k === 'dest') renderDest();
  else if(V.k === 'fx') renderFx();
  else renderBackup();
  renderBar();
}

/* Delegated Event Listeners */
document.addEventListener('click', function(ev){
  if(ev.target.closest && ev.target.closest('a')) return;
  var el = ev.target.closest('[data-a]');
  if(!el) return;
  var a = el.getAttribute('data-a');
  var id = el.getAttribute('data-id'), did = el.getAttribute('data-d');
  if(a === 'goDest'){ V = {k:'dest', id:id}; render(); $('content').scrollTop = 0; }
  else if(a === 'goTool'){ V = {k:id}; render(); $('content').scrollTop = 0; }
  else if(a === 'switchTab'){
    TAB = el.getAttribute('data-tab') === 'gastos' ? 'gastos' : 'itinerario';
    V = {k:'dest', id:homeId()}; render(); $('content').scrollTop = 0;
  }
  else if(a === 'addCurrent'){
    if(V.k !== 'dest'){ V = {k:'dest', id:homeId()}; render(); }
    if(TAB === 'gastos') openForm(V.id, null); else openStopForm(V.id, null);
  }
  else if(a === 'cityMap'){ var cd = dest(homeId()); openMapSheet('atracciones turísticas en ' + cd.name, 'Atracciones en ' + cd.name); }
  else if(a === 'mapStop'){
    var md = dest(did), mf = findStop(md, id);
    if(mf) openMapSheet(mf.stop.place + ', ' + md.name, mf.stop.place);
  }
  else if(a === 'dlgOk'){ var fn = pendingOk; closeDlg(); if(fn) fn(); }
  else if(a === 'dlgNo') closeDlg();
  else if(a === 'addCity') openCityForm(null);
  else if(a === 'editCity') openCityForm(id);
  else if(a === 'saveCity') saveCity(id);
  else if(a === 'delCity') delCity(id);
  else if(a === 'editStop') openStopForm(did, id);
  else if(a === 'saveStop') saveStop(did, id);
  else if(a === 'delStop') delStop(did, id);
  else if(a === 'edit') openForm(did, id);
  else if(a === 'closeForm') closeForm();
  else if(a === 'saveForm') saveForm(did, id);
  else if(a === 'del'){
    askConfirm('¿Eliminar este gasto?', 'Eliminar', function(){
      var d = dest(did); d.entries = d.entries.filter(function(x){ return x.id !== id; });
      save(); render();
    });
  }
  else if(a === 'togglePaid'){
    dest(did).entries.forEach(function(x){ if(x.id === id) x.paid = !x.paid; });
    save(); render();
  }
  else if(a === 'swap'){
    var f = $('cvFrom').value; $('cvFrom').value = $('cvTo').value; $('cvTo').value = f; updateFx();
  }
  else if(a === 'export') doExport();
  else if(a === 'reset'){
    askConfirm('¿Restablecer todos los datos al itinerario inicial?', 'Restablecer', function(){ S = seed(); save(); V = {k:'dest', id:S.dests[0].id}; render(); });
  }
});

document.addEventListener('input', function(ev){
  var el = ev.target, a = el.getAttribute && el.getAttribute('data-a');
  if(a === 'rate'){ S.rates[el.getAttribute('data-c')] = el.value; save(); updateFx(); }
  else if(a === 'cv') updateFx();
});

document.addEventListener('change', function(ev){
  var el = ev.target, a = el.getAttribute && el.getAttribute('data-a');
  if(a === 'setDisp'){ S.disp = el.value; save(); render(); }
  else if(a === 'cv') updateFx();
  else if(a === 'cityCur') syncCityRate();
  else if(a === 'import') doImport(el.files[0]);
});

$('modal').addEventListener('click', function(ev){ if(ev.target === $('modal')) closeForm(); });
$('dlg').addEventListener('click', function(ev){ if(ev.target === $('dlg')) closeDlg(); });
document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape'){ if($('dlg').style.display === 'flex') closeDlg(); else closeForm(); } });

render();
})();
</script>
